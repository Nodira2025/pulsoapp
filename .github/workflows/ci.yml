name: Validar cambios
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          # Valores de relleno: la compilación no se conecta a ningún servicio.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_BASE_PATH: /pulsoapp/
