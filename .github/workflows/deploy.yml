name: Validate and publish PULSO
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /pulsoapp/
          # Públicos por diseño (ver README). Se declaran acá porque el código ya no tiene valores por defecto.
          VITE_SUPABASE_URL: https://ckcbxnhwpnvhpskculga.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cCX6krVyAF6Q-4JVCr1GVg_LxPkkl4o
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
